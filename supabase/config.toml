# Supabase CLI settings for Jeel. Only what differs from the CLI defaults.
project_id = "jeel"

[db]
major_version = 17

# Both functions check their own secret (x-cron-secret / Meta's signature), not a Supabase JWT.
[functions.send-due-reminders]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

# Login: email code / magic link only, and only for the two accounts made by scripts/setup-household.mjs.
[auth]
site_url = "https://naory21.github.io/jeel/"
additional_redirect_urls = ["https://naory21.github.io/jeel/"]
enable_signup = false

# Email provider stays on (this key is the provider switch); new sign-ups are closed by auth.enable_signup above.
[auth.email]
enable_signup = true
otp_length = 6

# Email shows the 6-digit code (the home-screen app can't use a link opened from Mail).
[auth.email.template.magic_link]
subject = "קוד הכניסה שלך ל-Jeel"
content_path = "./supabase/templates/magic_link.html"
