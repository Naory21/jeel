<!-- Supabase → Authentication → Emails → "Magic Link". Subject: קוד הכניסה שלך ל-Jeel -->
<div dir="rtl" style="font-family: Arial, Helvetica, sans-serif; color: #18212B; max-width: 420px; margin: 0 auto; padding: 24px; text-align: right">
  <h2 style="margin: 0 0 12px">כניסה ל-Jeel</h2>
  <p style="margin: 0 0 16px; color: #56616E">הקלידו את הקוד באפליקציה:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; margin: 0 0 20px; direction: ltr; text-align: center">{{ .Token }}</p>
  <p style="margin: 0 0 12px; color: #56616E">או פשוט לחצו כאן (באותו טלפון):</p>
  <p style="margin: 0 0 24px"><a href="{{ .ConfirmationURL }}" style="background: #18212B; color: #FFFFFF; padding: 12px 20px; border-radius: 10px; text-decoration: none; display: inline-block">כניסה</a></p>
  <p style="font-size: 12px; color: #7D8792; margin: 0">לא ביקשתם להיכנס? אפשר להתעלם מהמייל.</p>
</div>
